<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Bot head -->
  <rect x="6" y="8" width="20" height="16" rx="4" fill="#16a34a"/>
  <!-- Eyes -->
  <circle cx="12" cy="16" r="2.2" fill="white"/>
  <circle cx="20" cy="16" r="2.2" fill="white"/>
  <!-- Pupils -->
  <circle cx="12.6" cy="15.8" r="0.9" fill="#052e16"/>
  <circle cx="20.6" cy="15.8" r="0.9" fill="#052e16"/>
  <!-- Mouth -->
  <path d="M12 20.5 Q16 23 20 20.5" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- Antenna -->
  <line x1="16" y1="8" x2="16" y2="4" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16" cy="3.2" r="1.8" fill="#22c55e"/>
  <!-- Ears -->
  <rect x="3" y="13" width="3" height="5" rx="1.5" fill="#15803d"/>
  <rect x="26" y="13" width="3" height="5" rx="1.5" fill="#15803d"/>
</svg>
